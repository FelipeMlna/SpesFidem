<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Spesfidem Aluminio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .login-container {
            max-width: 540px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            padding: 4rem 3.5rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-brand {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-brand h1 {
            font-size: 2.8rem;
            font-family: 'Outfit', sans-serif;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .login-brand span {
            color: var(--accent, #f59e0b);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .login-brand p {
            font-size: 1.15rem !important;
            color: #94a3b8;
            margin-top: 0.8rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group label {
            display: block !important;
            font-size: 1.3rem !important;
            font-weight: 900 !important;
            color: #ffffff !important;
            margin-bottom: 0.8rem !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }

        .input-group input {
            width: 100% !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border: 2px solid rgba(255, 255, 255, 0.25) !important;
            border-radius: 14px !important;
            padding: 1.4rem 1.4rem !important;
            color: white !important;
            font-size: 1.35rem !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            box-sizing: border-box !important;
        }

        .input-group input::placeholder {
            font-size: 1.15rem;
            color: #94a3b8;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent, #f59e0b) !important;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.25);
            outline: none;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: white;
            transform: translateX(-5px);
        }

        .error-msg {
            display: none;
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
        }

        .info-msg {
            display: none;
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 2.5rem 1.8rem;
            }

            .login-brand h1 {
                font-size: 2.2rem;
            }

            .input-group label {
                font-size: 1.1rem !important;
            }

            .input-group input {
                font-size: 1.15rem !important;
                padding: 1.2rem 1rem !important;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Volver al Inicio
    </a>

    <div class="login-container">
        <div class="login-brand">
            <h1>Inicio de <span style="display:block; letter-spacing:8px; font-size:1.2rem; margin-top:0.5rem;">Sesión</span></h1>
            <p>Acceda a su cuenta de Spesfidem Aluminio</p>
        </div>

        <div class="info-msg" id="infoMsg">
            <i class="fas fa-check-circle"></i> ¡Registro completado! Ingrese su contraseña para continuar.
        </div>

        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="input-group">
                <label>Correo Electrónico o Documento *</label>
                <input type="text" id="email" placeholder="Ej: correo@ejemplo.com o C.C." required autocomplete="username">
            </div>

            <div class="input-group">
                <label>Contraseña *</label>
                <div style="position: relative;">
                    <input type="password" id="pass" placeholder="Ingresa tu contraseña" required autocomplete="current-password" style="padding-right: 50px !important;">
                    <i class="fas fa-eye" id="togglePassword" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; font-size: 1.3rem;" title="Mostrar/Ocultar contraseña"></i>
                </div>
            </div>

            <div class="error-msg" id="errMsg"></div>

            <button class="btn-metallic-gold" type="submit" id="loginBtn" style="width: 100%; padding: 1.4rem 2rem !important; font-size: 1.25rem !important; font-weight: 900 !important; border-radius: 50px; cursor: pointer; justify-content: center !important;">
                <i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 1.1rem; color: #94a3b8;">
            ¿No tienes una cuenta? <a href="register.html" style="color: var(--accent, #f59e0b); font-weight: 700; text-decoration: none;">Regístrate aquí</a>
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <span id="modeBadge" style="font-size: 0.85rem; color: #64748b; background: rgba(255, 255, 255, 0.04); padding: 0.4rem 1rem; border-radius: 50px; display: inline-block;">Verificando conexión...</span>
        </div>
    </div>

    <!-- Background Decoration -->
    <div style="position: fixed; top: -10%; right: -5%; width: 40%; height: 60%; background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%); z-index: -1;"></div>
    <div style="position: fixed; bottom: -10%; left: -5%; width: 40%; height: 60%; background: radial-gradient(circle, rgba(14, 165, 233, 0.05) 0%, transparent 70%); z-index: -1;"></div>

    <script src="js/firebase-config.js"></script>
    <script src="js/crm-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Setup Firebase
            if (window.SpesFirebase) {
                await window.SpesFirebase.initFirebase();
                const badge = document.getElementById('modeBadge');
                if (badge) badge.textContent = window.SpesFirebase.isFirebaseReady() ? '🔥 Firebase Conectado' : '💾 Modo Local';
            }

            // Check params from registration redirect
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                const infoMsg = document.getElementById('infoMsg');
                if (infoMsg) infoMsg.style.display = 'block';
                const emailInput = document.getElementById('email');
                if (emailInput && urlParams.get('email')) {
                    emailInput.value = urlParams.get('email');
                    document.getElementById('pass')?.focus();
                }
            }

            // Toggle Password Visibility
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('pass');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function () {
                    const isPass = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPass ? 'text' : 'password');
                    this.classList.toggle('fa-eye-slash');
                    this.classList.toggle('fa-eye');
                    this.style.color = isPass ? '#38bdf8' : '#94a3b8';
                });
            }
        });

        window.doLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errMsg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
            if (err) err.style.display = 'none';

            const result = await window.CrmAuth.login(
                document.getElementById('email').value.trim(),
                document.getElementById('pass').value.trim()
            );

            if (result.success) {
                const urlParams = new URLSearchParams(window.location.search);
                let redirect = urlParams.get('redirect');
                if (!redirect) {
                    redirect = (result.user && result.user.role === 'admin') ? 'admin.html' : 'index.html';
                }
                window.location.href = redirect;
            } else {
                if (err) {
                    err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${result.message}`;
                    err.style.display = 'block';
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN';
            }
        };
    </script>
</body>

</html>
